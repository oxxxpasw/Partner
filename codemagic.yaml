# Конфигурация Codemagic для SosediFedi Partner
# Flutter 3.47.1, флейвор apprelease, автоматическая подпись и публикация в Релиз App Store

workflows:
  ios-appstore:
    name: iOS (apprelease) → App Store Release
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      flutter: 3.47.1
      xcode: latest
      cocoapods: default
      groups:
        - APPLE_CREDS # Ваша группа секретов (Issuer ID, Key ID, .p8 закрытый ключ)
      vars:
        FLAVOR: apprelease
        BUNDLE_ID: com.lilcoffee.sell

    scripts:
      - name: Set up iOS code signing
        script: |
          # 1. Запрашиваем у Apple актуальные профили для App Store
          app-store-connect fetch-signing-files "$BUNDLE_ID" --type IOS_APP_STORE --create
          
          # 2. Создаем и открываем Keychain, чтобы Xcode увидел сертификаты
          platform-utils keychain initialize
          platform-utils keychain add-certificates

      - name: Get Flutter dependencies
        script: |
          flutter pub get

      - name: CocoaPods install
        script: |
          cd ios
          pod install --repo-update

      - name: Build IPA (apprelease)
        script: |
          set -e
          # Собираем проект. Флаг --no-authentication говорит Flutter не пытаться 
          # авторизоваться в Apple заново, так как мы сделали это на первом шаге.
          flutter build ipa --release \
            --flavor $FLAVOR \
            --target=lib/main.dart \
            --build-name=1.1.329 \
            --build-number=330 \
            --export-options-plist=$HOME/export_options.plist \
            --no-authentication

    artifacts:
      - build/ios/ipa/*.ipa

    # НАСТРОЙКА АВТОМАТИЧЕСКОГО РЕЛИЗА В APP STORE
    publishing:
      email:
        recipients:
          - you@example.com # 👈 Замените на ваш e-mail для отчетов о сборке
      app_store_connect:
        auth: integration
        submit_to_testflight: false
        submit_to_app_store: true   # Отправляем напрямую на модерацию в App Store
        release_type: MANUAL        # Приложение выйдет в магазин только после вашего клика в панели Apple
