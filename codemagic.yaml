# Конфигурация Codemagic для SosediFedi Partner
# Flutter 3.47.1, флейвор apprelease, автоматическая подпись и публикация в Релиз App Store

workflows:
  ios-appstore:
    name: iOS (apprelease) → App Store Release
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      flutter: 3.47.1
      xcode: latest
      cocoapods: default
      groups:
        - APPLE_CREDS # Группа секретов в панели Codemagic (Issuer ID, Key ID, .p8)
      vars:
        FLAVOR: apprelease
        BUNDLE_ID: com.lilcoffee.sell

    scripts:
      - name: Set up iOS code signing
        script: |
          # 1. Автоматически генерируем сертификат и профиль распределения App Store
          app-store-connect fetch-signing-files "$BUNDLE_ID" --type IOS_APP_STORE --create
          
          # 2. Инициализируем связку ключей на виртуальном Mac
          platform-utils keychain initialize
          platform-utils keychain add-certificates

      - name: Get Flutter dependencies
        script: |
          flutter pub get

      - name: CocoaPods install
        script: |
          cd ios
          pod install --repo-update

      - name: Build iOS Archive and IPA
        script: |
          set -e
          # 1. Флаг --no-authentication отключает повторную авторизацию во Flutter.
          # 2. Переменная в --xcconfig-flags принудительно заставляет Xcode использовать 
          # конфигурацию Release-apprelease вместо дефолтного сваливания в Debug.
          flutter build ipa --release \
            --flavor $FLAVOR \
            --target=lib/main.dart \
            --build-name=1.1.329 \
            --build-number=330 \
            --export-options-plist=$HOME/export_options.plist \
            --no-authentication \
            --xcconfig-flags="BuildConfiguration=Release-apprelease"

    artifacts:
      - build/ios/ipa/*.ipa

    # НАСТРОЙКА АВТОМАТИЧЕСКОГО РЕЛИЗА В APP STORE
    publishing:
      email:
        recipients:
          - you@example.com # 👈 Укажите ваш email для уведомлений
      app_store_connect:
        auth: integration
        submit_to_testflight: false 
        submit_to_app_store: true   
        release_type: MANUAL        
