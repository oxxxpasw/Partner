# Конфигурация Codemagic для SosediFedi Partner
# Flutter 3.47.1, флейвор apprelease, автоматическая подпись и публикация в Релиз App Store [Полный файл codemagic.yaml]

workflows:
  ios-appstore:
    name: iOS (apprelease) → App Store Release
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      flutter: 3.47.1
      xcode: latest
      cocoapods: default
      groups:
        - APPLE_CREDS # Группа секретов в панели Codemagic (Issuer ID, Key ID, .p8) [Полный файл codemagic.yaml]
      vars:
        FLAVOR: apprelease
        BUNDLE_ID: com.lilcoffee.sell

    scripts:
      - name: Set up iOS code signing
        script: |
          # Автоматически генерируем сертификат и профиль распределения App Store [Полный файл codemagic.yaml]
          app-store-connect fetch-signing-files "$BUNDLE_ID" --type IOS_APP_STORE --create
          
          # Инициализируем связку ключей на виртуальном Mac [Полный файл codemagic.yaml]
          platform-utils keychain initialize
          platform-utils keychain add-certificates

      - name: Get Flutter dependencies
        script: |
          flutter pub get

      - name: CocoaPods install
        script: |
          cd ios
          pod install --repo-update

      - name: Build IPA (apprelease)
        script: |
          set -e
          # Флаг --no-authentication отключает повторную авторизацию во Flutter, 
          # так как утилита fetch-signing-files уже скачала и установила все сертификаты.
          flutter build ipa --release \
            --flavor $FLAVOR \
            --target=lib/main.dart \
            --build-name=1.1.329 \
            --build-number=330 \
            --export-options-plist=$HOME/export_options.plist \
            --no-authentication

    artifacts:
      - build/ios/ipa/*.ipa

    # НАСТРОЙКА АВТОМАТИЧЕСКОГО РЕЛИЗА В APP STORE [Полный файл codemagic.yaml]
    publishing:
      email:
        recipients:
          - you@example.com # 👈 Укажите ваш email для уведомлений [Полный файл codemagic.yaml]
      app_store_connect:
        auth: integration
        submit_to_testflight: false # Отключаем TestFlight [Полный файл codemagic.yaml]
        submit_to_app_store: true   # Включаем прямую отправку в App Store на модерацию [Полный файл codemagic.yaml]
        release_type: MANUAL        # MANUAL — вы сами опубликуете приложение кнопкой после аппрува Apple [Полный файл codemagic.yaml]
