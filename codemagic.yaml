# Конфигурация Codemagic для SosediFedi Partner
# Flutter 3.47.1, флейвор apprelease, автоматическая подпись и публикация в Релиз App Store

workflows:
  ios-appstore:
    name: iOS (apprelease) → App Store Release
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      flutter: 3.47.1
      xcode: latest
      cocoapods: default
      groups:
        - APPLE_CREDS # Группа секретов в панели Codemagic (Issuer ID, Key ID, .p8)
      vars:
        FLAVOR: apprelease
        BUNDLE_ID: com.lilcoffee.sell

    scripts:
      - name: Set up iOS code signing
        script: |
          # Автоматически генерируем сертификат и профиль распределения App Store
          app-store-connect fetch-signing-files "$BUNDLE_ID" --type IOS_APP_STORE --create
          
          # Инициализируем связку ключей на виртуальном Mac
          platform-utils keychain initialize
          platform-utils keychain add-certificates

      - name: Get Flutter dependencies
        script: |
          flutter pub get

      - name: CocoaPods install
        script: |
          cd ios
          pod install --repo-update

      - name: Build IPA (apprelease)
        script: |
          set -e
          # Собираем релизный .ipa
          flutter build ipa --release \
            --flavor $FLAVOR \
            --build-name=1.1.329 \
            --build-number=329 \
            --export-options-plist=$HOME/export_options.plist

    artifacts:
      - build/ios/ipa/*.ipa

    # 👇 НАСТРОЙКА АВТОМАТИЧЕСКОГО РЕЛИЗА В APP STORE
    publishing:
      email:
        recipients:
          - you@example.com # Укажите ваш email для уведомлений
      app_store_connect:
        auth: integration
        submit_to_testflight: false # 👈 Отключаем TestFlight
        submit_to_app_store: true   # 👈 Включаем прямую отправку в App Store на модерацию
        
        # Выберите стратегию релиза после прохождения модерации (выберите ОДИН из вариантов ниже):
        # MANUAL — вы сами зайдете и нажмете кнопку "Выпустить", когда Apple одобрит приложение
        # AUTOMATIC — приложение опубликуется в магазине САМО сразу после одобрения
        # SCHEDULED — публикация в заданное время
        release_type: MANUAL 
