name: iOS (apprelease) → TestFlight

on:
  push:
    branches:
      - main # Сборка будет запускаться при пуше в ветку main (измените, если нужно)
  workflow_dispatch: # Позволяет запускать сборку вручную кнопкой на GitHub

jobs:
  ios-appstore:
    name: Build & Release iOS
    runs-on: macos-latest # Для сборки iOS нужна виртуальная машина macOS

    steps:
      # 1. Скачиваем код из вашего GitHub-репозитория
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Устанавливаем Java (требуется для инструментов сборки)
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      # 3. Устанавливаем конкретную версию Flutter из вашего ТЗ
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.1' # Точная версия из вашего ТЗ
          channel: 'stable'
          cache: true

      # 4. Скачиваем зависимости Flutter
      - name: Get Flutter dependencies
        run: flutter pub get

      # 5. Устанавливаем CocoaPods
      - name: CocoaPods install
        run: |
          cd ios
          pod install --repo-update

      # 6. Настраиваем авторизацию Apple API для автоматической подписи
      - name: Set up iOS code signing certificates
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_IDENTIFIER }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          KEY_CONTENT: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
        run: |
          # Создаем системную папку для ключа авторизации Xcode
          mkdir -p ~/.appstoreconnect/private_keys
          echo "$KEY_CONTENT" > ~/.appstoreconnect/private_keys/AuthKey_$KEY_ID.p8
          
          # Создаем временную защищенную связку ключей на Mac
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          KEYCHAIN_PASSWORD="temporary_password"
          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security default-keychain -s $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

      # 7. Компилируем проект в .ipa с авто-генерацией профилей подписи
      - name: Build IPA (apprelease)
        env:
          XCODE_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_IDENTIFIER }}
          XCODE_API_KEY_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          flutter build ipa --release \
            --flavor apprelease \
            --build-name=1.1.329 \
            --build-number=329 \
            --export-method app-store \
            --allow-provisioning-updates

      # 8. Загружаем готовое приложение в TestFlight / App Store Connect
      - name: Upload to App Store Connect
        run: |
          # Ищем скомпилированный файл .ipa в папке сборки
          IPA_PATH=$(find build/ios/ipa -name "*.ipa" | head -n 1)
          
          # Отправляем файл напрямую в Apple через стандартную утилиту xcrun
          xcrun altool --upload-app \
            --type ios \
            --file "$IPA_PATH" \
            --apiKey "${{ secrets.APP_STORE_CONNECT_KEY_IDENTIFIER }}" \
            --apiIssuer "${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}"
