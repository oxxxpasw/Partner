name: Flutter iOS Build for AltStore

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        channel: 'stable'
        architecture: x64

    - name: Get Flutter dependencies
      run: flutter pub get

    - name: Build Flutter iOS (No Sign)
      run: |
        flutter build ios --no-codesign --release

    - name: Prepare APP folder for AltStore
      run: |
        mkdir -p Payload
        APP_PATH=$(find build -name "Runner.app" -type d | head -n 1)
        if [ -z "$APP_PATH" ]; then
          echo "Ошибка: Файл Runner.app не найден!"
          exit 1
        fi
        echo "Найден Runner.app по пути: $APP_PATH"
        cp -r "$APP_PATH" Payload/
        zip -r Partner.ipa Payload

    - name: Upload IPA Artifact
      uses: actions/upload-artifact@v4
      with:
        name: partner-ios-app
        path: Partner.ipa
