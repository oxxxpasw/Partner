# Codemagic configuration for SosediFedi Partner
# Flutter 3.47.1, флейвор aprelease, автоматическая подпись и релиз в TestFlight

workflows:
  ios-appstore:
    name: iOS (apprelease) → TestFlight
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      flutter: 3.47.1 # Жестко фиксируем версию Flutter, как указано в вашем ТЗ
      xcode: latest
      cocoapods: default
      groups:
        - APPLE_CREDS # Убедитесь, что в UI Codemagic создана группа с этим именем
      vars:
        FLAVOR: apprelease
        BUNDLE_ID: com.lilcoffee.sell
        
    scripts:
      - name: Set up iOS code signing
        script: |
          # 1. Автоматически запрашиваем и генерируем сертификаты/профили у Apple
          app-store-connect fetch-signing-files "$BUNDLE_ID" --type IOS_APP_STORE --create
          
          # 2. Инициализируем Keychain на виртуальном Mac для хранения этих сертификатов
          platform-utils keychain initialize
          platform-utils keychain add-certificates

      - name: Get Flutter dependencies
        script: |
          flutter pub get

      - name: CocoaPods install
        script: |
          cd ios
          pod install --repo-update

      - name: Build IPA (apprelease)
        script: |
          set -e
          # Генерируем exportOptions.plist автоматически в домашнюю директорию, 
          # чтобы не тащить локальный файл из вашей папки D:\...
          flutter build ipa --release \
            --flavor $FLAVOR \
            --build-name=1.1.329 \
            --build-number=329 \
            --export-options-plist=$HOME/export_options.plist

    artifacts:
      - build/ios/ipa/*.ipa

    publishing:
      email:
        recipients:
          - you@example.com # 👈 Укажите свой реальный e-mail для уведомлений
      app_store_connect:
        auth: integration # Использует системную интеграцию через переменные окружения
        submit_to_testflight: true
        beta_groups:
          - SosediFedi-Инвесторы
