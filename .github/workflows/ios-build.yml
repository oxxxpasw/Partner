# Codemagic.yaml — сборка iOS (только iOS) для SosediFedi Partner
# Flutter 3.47.1, флейвор aprelease, подпись через App Store Connect API key,
# публикация в TestFlight. Положи в корень репо (D:\coffelilactual\Partner\codemagic.yaml).
 
workflows:
  ios-appstore:
    name: iOS (apprelease) → TestFlight
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      flutter: stable           # проект на 3.47.1; если хочешь прибить версию — укажи точную в Codemagic (Flutter versions) или git_ref
      xcode: latest
      cocoapods: default
      groups:
        # группа APPLE_CREDS в настроffikах (Settings → Groups) или прямо в vars:
        - APPLE_CREDS
      vars:
        FLAVOR: apprelease          # aprelease (прод) | apptest (тест)
        BUNDLE_ID: com.lilcoffee.sell
        TEAM_ID: SKD9XFX3L6
        # App Store Connect API key (ключ создан в ASC, Key ID у тебя: 3d30b5f7-...; .p8 cкачняется один раз в Codemagic App settings → App Store Connect API key)
        # APP_STORE_CONNECT_ISSUER_ID и KEY_ID задавать в группах/UI, в yaml они через переменные ниже
    scripts:
      - name: Setup Flutter
        script: |
          flutter pub get
      - name: CocoaPods install
        script: |
          cd ios
          pod install --repo-update
      - name: Build IPA (apprelease, app-store-connect)
        script: |
          set -e
          flutter build ipa --release \
            --flavor $FLAVOR \
            --export-options-plist=scripts/ios/exportOptions_app-store-connect.plist \
            --build-name=1.1.329 --build-number=329
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      email:
        recipients:
          - you@example.com   # заменить на свой e-mail
      app_store_connect:
        # в Codemagic App settings → "App Store Connect API key" добавь ключ
        # (Issuer ID + .p8 + Key ID 3d30b5f7-67f1-4561-b74b-cf57b0124adc) и укажи его имя ниже.
        api_key: APP_STORE_CONNECT_KEY
        submit_to_testflight: true
        beta_groups:
          - SosediFedi-Инвесторы   # при желании группа TestFlight
        # distribution: app-store  # раскомментировать, если сразу в App Store (надо upload + release)
 
  ios-adhoc:
    name: iOS (apprelease) ad-hoc / артефакт
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      vars:
        FLAVOR: apprelease
    scripts:
      - name: Setup + deps
        script: |
          flutter pub get
          cd ios && pod install --repo-update
      - name: Build IPA (ad-hoc)
        script: |
          set -e
          flutter build ipa --release --no-codesign \
            --flavor $FLAVOR
    artifacts:
      - build/ios/ipa/*.ipa
 
