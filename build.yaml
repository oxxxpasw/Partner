targets:
  $default:
    builders:
      flutter_gen_runner:
        options:
          output: lib/generated/
          integrations:
            flutter_svg: true
      json_serializable:
        options:
          any_map: false
          checked: false
          constructor: ""
          create_factory: true
          create_to_json: true
          disallow_unrecognized_keys: false
          explicit_to_json: true
          field_rename: snake
          generic_argument_factories: false
          ignore_unannotated: false
          include_if_null: true
          default_on_exception: true
